<div class="row justify-content-center text-center">
  <div class="col-lg-8">
    <h2 class="bolded-blue" data-i18n="study-results-header"></h2>

    {{#if data.code}}
    <div class="p-3 rounded my-4" style="background:#f3f2ff; border:1.5px solid #e0deff; display:inline-block; min-width:300px;">
      <p class="mb-1 text-muted small" data-i18n="litw-results-code"></p>
      <p class="fw-bold mb-0" style="font-size:1.4em; letter-spacing:0.1em; color:#6c63ff;">{{ data.code }}</p>
    </div>
    {{/if}}

    <p class="mt-3" data-i18n="study-results-p1"></p>

    {{#if data.feedback}}
    <div class="mt-4 p-4 rounded text-start" style="background:#f8f8ff; border:1px solid #e0deff;">
      <h5 class="bolded-blue mb-3" data-i18n="study-results-feedback-title"></h5>

      <div class="mb-4 p-3 rounded text-center" style="background:#6c63ff; color:white;">
        <div class="small mb-1" data-i18n="study-results-your-style"></div>
        <div class="fw-bold" style="font-size:1.15em;">{{ data.feedback.profileTitle }}</div>
        <div class="small mt-1" style="opacity:0.85;">{{ data.feedback.culturalContext }}</div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between mb-1">
          <span class="small fw-semibold" data-i18n="study-results-dim-indirectness"></span>
          <span class="small text-muted">{{ data.feedback.indirectness }}/5</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="small text-muted" style="min-width:3.5rem;" data-i18n="study-results-dim-direct"></span>
          <div class="flex-grow-1 rounded" style="background:#e0deff; height:10px;">
            <div class="rounded" style="background:#6c63ff; height:10px; width:{{ data.feedback.indirectnessPct }}%;"></div>
          </div>
          <span class="small text-muted" style="min-width:3.5rem; text-align:right;" data-i18n="study-results-dim-indirect"></span>
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between mb-1">
          <span class="small fw-semibold" data-i18n="study-results-dim-imposition"></span>
          <span class="small text-muted">{{ data.feedback.imposition }}/5</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="small text-muted" style="min-width:3.5rem;" data-i18n="study-results-dim-minimal"></span>
          <div class="flex-grow-1 rounded" style="background:#e0deff; height:10px;">
            <div class="rounded" style="background:#6c63ff; height:10px; width:{{ data.feedback.impositionPct }}%;"></div>
          </div>
          <span class="small text-muted" style="min-width:3.5rem; text-align:right;" data-i18n="study-results-dim-strong"></span>
        </div>
      </div>

      <p class="mt-3 mb-1 small">{{ data.feedback.profileDesc }}</p>
      <p class="text-muted small mb-0" data-i18n="study-results-feedback-note"></p>
    </div>
    {{/if}}

    <p class="mt-4 text-muted small" data-i18n="study-results-contact"></p>
  </div>
</div>

<div id="results-footer"></div>
