<div class="row justify-content-center text-center">
  <div class="col-lg-10">
    <h2 class="bolded-blue" data-i18n="study-results-header"></h2>

    {{#if data.code}}
    <div class="p-3 rounded my-4" style="background:#f3f2ff; border:1.5px solid #e0deff; display:inline-block; min-width:300px;">
      <p class="mb-1 text-muted small" data-i18n="litw-results-code"></p>
      <p class="fw-bold mb-0" style="font-size:1.4em; letter-spacing:0.1em; color:#6c63ff;">{{ data.code }}</p>
    </div>
    {{/if}}

    <p class="mt-3" data-i18n="study-results-p1"></p>

    {{#if data.feedback}}
    <div class="mt-4 p-4 rounded text-start" style="background:#f8f8ff; border:1px solid #e0deff;">
      <h5 class="bolded-blue mb-3" data-i18n="study-results-feedback-title"></h5>

      <div class="mb-4 p-3 rounded text-center" style="background:#6c63ff; color:white;">
        <div class="mb-1" data-i18n="study-results-your-style"></div>
        <div class="fw-bold" style="font-size:1.15em;">{{ data.feedback.profileTitle }}</div>
        <div class="mt-1" style="opacity:0.85;">{{ data.feedback.culturalContext }}</div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between mb-1">
          <span class="fw-semibold" data-i18n="study-results-dim-indirectness"></span>
          <span class="text-muted">{{ data.feedback.indirectness }}/5</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted" style="min-width:3.5rem;" data-i18n="study-results-dim-direct"></span>
          <div class="flex-grow-1 rounded" style="background:linear-gradient(to right, #4A90D9, #E87040); height:12px; position:relative;">
            <div style="position:absolute; top:50%; left:{{ data.feedback.indirectnessPct }}%; transform:translate(-50%,-50%); width:18px; height:18px; background:white; border-radius:50%; border:2.5px solid #444; box-shadow:0 1px 4px rgba(0,0,0,0.25);"></div>
          </div>
          <span class="text-muted" style="min-width:3.5rem; text-align:right;" data-i18n="study-results-dim-indirect"></span>
        </div>
        <p class="text-muted mt-1 mb-0" data-i18n="study-results-dim-indirectness-desc"></p>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between mb-1">
          <span class="fw-semibold" data-i18n="study-results-dim-imposition"></span>
          <span class="text-muted">{{ data.feedback.imposition }}/5</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted" style="min-width:3.5rem;" data-i18n="study-results-dim-minimal"></span>
          <div class="flex-grow-1 rounded" style="background:linear-gradient(to right, #4A90D9, #E87040); height:12px; position:relative;">
            <div style="position:absolute; top:50%; left:{{ data.feedback.impositionPct }}%; transform:translate(-50%,-50%); width:18px; height:18px; background:white; border-radius:50%; border:2.5px solid #444; box-shadow:0 1px 4px rgba(0,0,0,0.25);"></div>
          </div>
          <span class="text-muted" style="min-width:3.5rem; text-align:right;" data-i18n="study-results-dim-strong"></span>
        </div>
        <p class="text-muted mt-1 mb-0" data-i18n="study-results-dim-imposition-desc"></p>
      </div>

      <p class="mt-3 mb-1">{{ data.feedback.profileDesc }}</p>
      <p class="text-muted mb-0" data-i18n="study-results-feedback-note"></p>
    </div>
    {{/if}}

    <p class="mt-4 text-muted" data-i18n="study-results-contact"></p>
  </div>
</div>

<div id="results-footer"></div>
