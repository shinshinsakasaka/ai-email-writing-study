<div class="row justify-content-center">
  <div id="local_data_id" data-local_id="{{ local_data_id }}"></div>
  <div class="col-lg-8">
    <h2 class="bolded-blue" data-i18n="litw-demographics-title"></h2>
    <p class="text-muted small" data-i18n="litw-demographics-required"></p>
  </div>
</div>

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div id="demographicsForm" style="text-align:left;"></div>
  </div>
</div>

<script type="text/javascript">
  $(document).ready(function() {
    $("#demographicsForm").alpaca({
      "data": {},
      "schema": {
        "description": "Email Study - Demographics",
        "type": "object",
        "properties": {
          "demographics-age": {
            "title": $.i18n('litw-demographics-age'),
            "type": "integer",
            "required": true
          },
          "demographics-gender": {
            "title": $.i18n('litw-demographics-gender'),
            "enum": ['female', 'male', 'non-binary', 'no-disclosure'],
            "required": true
          },
          "demographics-education": {
            "title": $.i18n('litw-demographics-education'),
            "enum": ['no-formal-edu', 'incomplete-primary', 'complete-primary',
              'incomplete-sec-high', 'complete-sec-high', 'university-no-degree',
              'university-degree', 'incomplete-grad', 'complete-grad'],
            "required": true
          },
          "demographics-tenure": {
            "title": $.i18n('study-demographics-tenure'),
            "enum": ['less-1yr', '1-3yr', '3-5yr', '5-10yr', 'more-10yr'],
            "required": true
          },
          "demographics-ai-use": {
            "title": $.i18n('study-demographics-ai-use'),
            "enum": ['never', 'rarely', 'sometimes', 'often', 'very-often'],
            "required": true
          }
        }
      },
      "options": {
        "fields": {
          "demographics-age": {
            "type": "integer",
            "showMessages": false
          },
          "demographics-gender": {
            "type": "select",
            "optionLabels": [
              $.i18n('litw-demographics-female'),
              $.i18n('litw-demographics-male'),
              $.i18n('litw-demographics-nonbinary'),
              $.i18n('litw-demographics-nodisclose')
            ],
            "sort": false,
            "noneLabel": "--",
            "removeDefaultNone": false,
            "showMessages": false,
            "default": "--"
          },
          "demographics-education": {
            "type": "select",
            "optionLabels": [
              $.i18n('litw-demographics-education1'), $.i18n('litw-demographics-education2'),
              $.i18n('litw-demographics-education3'), $.i18n('litw-demographics-education4'),
              $.i18n('litw-demographics-education5'), $.i18n('litw-demographics-education6'),
              $.i18n('litw-demographics-education7'), $.i18n('litw-demographics-education8'),
              $.i18n('litw-demographics-education9')
            ],
            "sort": false,
            "noneLabel": "--",
            "removeDefaultNone": false,
            "showMessages": false,
            "default": "--"
          },
          "demographics-tenure": {
            "type": "select",
            "optionLabels": [
              $.i18n('study-demographics-tenure-less1'),
              $.i18n('study-demographics-tenure-1-3'),
              $.i18n('study-demographics-tenure-3-5'),
              $.i18n('study-demographics-tenure-5-10'),
              $.i18n('study-demographics-tenure-more10')
            ],
            "sort": false,
            "noneLabel": "--",
            "removeDefaultNone": false,
            "showMessages": false,
            "default": "--"
          },
          "demographics-ai-use": {
            "type": "select",
            "optionLabels": [
              $.i18n('study-demographics-ai-never'),
              $.i18n('study-demographics-ai-rarely'),
              $.i18n('study-demographics-ai-sometimes'),
              $.i18n('study-demographics-ai-often'),
              $.i18n('study-demographics-ai-very-often')
            ],
            "sort": false,
            "noneLabel": "--",
            "removeDefaultNone": false,
            "showMessages": false,
            "default": "--"
          }
        }
      },
      "postRender": function(control) {
        $('#btn-next-page').attr('style', 'display:none;');
        $(".alpaca-required-indicator").html(" *");
      },
      "view": {
        "callbacks": {
          "valid": function() {
            $('#btn-next-page').attr('style', 'display:block;');
            $('#btn-next-page')[0].scrollIntoView();
          },
          "invalid": function() {
            $('#btn-next-page').attr('style', 'display:none;');
          }
        }
      }
    });
  });
</script>
