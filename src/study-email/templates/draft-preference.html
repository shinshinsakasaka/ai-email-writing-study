<div class="row justify-content-center">
  <div class="col-lg-8">
    <h2 class="bolded-blue" data-i18n="study-pref-header"></h2>
    <p class="mt-3" data-i18n="study-pref-p1"></p>
    <div class="pref-options mt-3">
      <label class="pref-option">
        <input type="radio" name="draft-pref" value="task2">
        <span data-i18n="study-pref-task2"></span>
      </label>
      <label class="pref-option">
        <input type="radio" name="draft-pref" value="task3">
        <span data-i18n="study-pref-task3"></span>
      </label>
      <label class="pref-option">
        <input type="radio" name="draft-pref" value="both">
        <span data-i18n="study-pref-both"></span>
      </label>
      <label class="pref-option">
        <input type="radio" name="draft-pref" value="neither">
        <span data-i18n="study-pref-neither"></span>
      </label>
      <label class="pref-option">
        <input type="radio" name="draft-pref" value="no_task2">
        <span data-i18n="study-pref-no-task2"></span>
      </label>
      <label class="pref-option">
        <input type="radio" name="draft-pref" value="no_task3">
        <span data-i18n="study-pref-no-task3"></span>
      </label>
      <label class="pref-option">
        <input type="radio" name="draft-pref" value="no_either">
        <span data-i18n="study-pref-no-either"></span>
      </label>
    </div>

    <div id="draft-no-reason-box" class="mt-4" style="display:none;">
      <label class="form-label fw-semibold" data-i18n="study-pref-why-label"></label>
      <textarea id="draft-no-reason" class="form-control mt-1" rows="3"></textarea>
    </div>
  </div>
</div>
<script>
  $('input[name="draft-pref"]').on('change', function() {
    var val = $(this).val();
    if (val === 'no_task2' || val === 'no_task3' || val === 'no_either') {
      $('#draft-no-reason-box').show();
    } else {
      $('#draft-no-reason-box').hide();
      $('#draft-no-reason').val('');
    }
  });
</script>
